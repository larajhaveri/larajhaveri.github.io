title: "Lara Jhaveri | Portfolio"
description: "A personal portfolio about product strategy, consumer technology, and the path from early-stage startups to global marketplaces."
url: "https://larajhaveri.github.io"
baseurl: ""
lang: en
author:
  name: "Lara Jhaveri"

markdown: kramdown
permalink: pretty
timezone: America/Los_Angeles

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - Change1.md
  - Change2.md
  - attached_assets
  - PLAN.md
  - README.md
  - replit.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - .bundle
  - .cache
  - .local
  - .agents
