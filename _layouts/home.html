---
layout: default
---
<section class="home-hero" aria-labelledby="home-title">
  <p class="eyebrow">{{ page.hero_eyebrow | escape }}</p>
  <h1 id="home-title">{{ page.hero_title | escape }} <span>{{ page.hero_highlight | escape }}</span></h1>
  <p class="lead">{{ page.hero_intro | escape }}</p>
  <p>{{ page.hero_summary | escape }}</p>
  <div class="button-row">
    <a class="button button-primary" href="{{ '/work-experience/' | relative_url }}">Explore my experience <span aria-hidden="true">↗</span></a>
    <a class="button button-secondary" href="{{ '/contact/' | relative_url }}">Get in touch</a>
  </div>
</section>
<div class="home-section">
  {{ content }}
</div>
